name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
          cache: maven
          server-id: dt_repository
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.P2_USER }}
          MAVEN_PASSWORD: ${{ secrets.P2_TOKEN }}
      - name: Build and test
        run: mvn -B -ntp clean verify -Dtycho.localArtifacts=ignore
